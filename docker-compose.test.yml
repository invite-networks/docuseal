# Standalone test stack. Run the suite with:
#   docker compose -f docker-compose.test.yml run --rm test bundle exec rspec
# The Postgres credentials below are for the throwaway test database only.
name: docuseal-test

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUNDLE_WITHOUT: ""
        INSTALL_TEST_BROWSER: "true"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./.rspec:/app/.rspec:ro
      - ./.rubocop.yml:/app/.rubocop.yml:ro
      - ./app:/app/app
      - ./config:/app/config
      - ./db:/app/db
      - ./lib:/app/lib
      - ./spec:/app/spec
    environment:
      RAILS_ENV: test
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuseal_test"]
      interval: 5s
      timeout: 5s
      retries: 5
